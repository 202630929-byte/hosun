<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 구글 폰트 (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti (축하 폭죽 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #FF5E36;
            --primary-hover: #E04822;
            --primary-light: #FFF0ED;
            --secondary: #4A3E3D;
            --bg-color: #FAF8F5;
            --card-bg: #FFFFFF;
            --text-main: #2D2926;
            --text-sub: #7A7571;
            --border-color: #EFECE6;
            --shadow: 0 12px 32px rgba(255, 94, 54, 0.08), 0 2px 6px rgba(0,0,0,0.04);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 94, 54, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 184, 0, 0.04) 0%, transparent 20%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 헤더 스타일 */
        header {
            text-align: center;
            padding: 16px 0 8px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.8px;
            line-height: 1.3;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-top: 8px;
        }

        /* 카테고리 필터 버튼 */
        .category-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-btn {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--secondary);
            color: #FFF;
            border-color: var(--secondary);
        }

        /* 메뉴 결과 카드 */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
        }

        /* 초기 빈 상태 표시 */
        .placeholder-box {
            padding: 50px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .placeholder-icon {
            width: 90px;
            height: 90px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .placeholder-text {
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 결과 상자 */
        .result-box {
            display: none;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            overflow: hidden;
            background-color: #F0EDE8;
        }

        .menu-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .menu-img {
            transform: scale(1.03);
        }

        .category-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            color: #FFF;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-content {
            padding: 24px;
        }

        .menu-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .tag {
            background: #F4F2EE;
            color: #66605B;
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .description {
            font-size: 0.95rem;
            color: #55504C;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .tip-box {
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            padding: 12px 16px;
            border-radius: 0 12px 12px 0;
            font-size: 0.88rem;
            color: #8C2A14;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tip-box i {
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* 룰렛 애니메이션 레이어 */
        .roulette-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .spinner-icon {
            font-size: 2.5rem;
            color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .roulette-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        /* 메인 버튼 */
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #FF6B4A 0%, #FF451D 100%);
            color: #FFFFFF;
            border: none;
            padding: 18px 24px;
            border-radius: 18px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 69, 29, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 69, 29, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        /* 서브 버튼들 */
        .action-group {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            background: #FFF;
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: #F7F5F0;
        }

        /* 추천 히스토리 기록 */
        .history-section {
            margin-top: 10px;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 18px 20px;
            border: 1px solid var(--border-color);
        }

        .history-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* 토스트 메세지 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(45, 41, 38, 0.92);
            color: #FFF;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 -->

        <!-- 서브 버튼 그룹 -->

            </div>
            <div class="history-tags" id="historyContainer"></div>
        </div>

        <footer>
            © 오늘 뭐 먹지? 저녁 메뉴 추천
        </footer>
    </div>

                desc: "두툼한 등심과 안심을 바삭하게 튀겨낸 돈카츠! 와사비와 소금을 살짝 찍어 고기 본연의 풍미를 느껴보세요.",
                tip: "시원한 미니 모밀이나 우동 세트로 더욱 풍성하게 즐기세요.",
                image: "https://images.unsplash.com/photo-1591814468924-caf88d1232e1?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "화덕 피자",
                category: "양식",
                tags: ["#치즈듬뿍", "#파티메뉴", "#피맥"],
                desc: "쫄깃한 도우 위에 고소한 치즈가 듬뿍 올라간 피자! 페퍼로니 피자나 고르곤졸라 피자로 맛있는 저녁 시간을 만드세요.",
                tip: "갈릭 디핑 소스를 꼭 추가해 도우 끝까지 맛있게 드세요.",
                image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "쫄깃한 족발 & 보쌈",
                category: "한식",
                tags: ["#야식강자", "#막국수필수", "#콜라겐충전"],
                desc: "야들야들하고 고소한 족발과 촉촉하게 삶아낸 보쌈! 매콤새콤한 쟁반막국수와 보쌈김치를 쌈에 싸서 크게 한 입!",
                tip: "새우젓과 무말랭이를 듬뿍 올린 한 쌈이 진리입니다.",
                image: "https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "뜨끈한 베트남 쌀국수",
                category: "중식/아시안",
                tags: ["#국물요리", "#속풀리는", "#담백함"],
                desc: "깊고 진한 양지 육수에 아삭한 숙주와 부드러운 쌀국수 면의 조화! 속이 따뜻해지고 부담 없이 편안한 메뉴입니다.",
                tip: "칠리소스와 해선장을 7:3 비율로 믹스해 고기를 찍어 드세요.",
                image: "https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let currentCategory = 'all';
        let currentMenu = null;
        let history = [];

        // 카테고리 설정
        function setCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        // 메뉴 추천 실행
        function recommendMenu() {
            let filteredList = menuList;
            if (currentCategory !== 'all') {
                filteredList = menuList.filter(m => m.category === currentCategory);
            }

            if (filteredList.length === 0) {
                showToast("해당 카테고리에 메뉴가 없습니다.");
                return;
            }

            const rouletteOverlay = document.getElementById('rouletteOverlay');
            const rouletteText = document.getElementById('rouletteText');
            const recommendBtn = document.getElementById('recommendBtn');

            // 룰렛 효과 시작
            rouletteOverlay.style.display = 'flex';
            recommendBtn.disabled = true;

            let spinCount = 0;
            const interval = setInterval(() => {
                const randomTemp = filteredList[Math.floor(Math.random() * filteredList.length)];
                rouletteText.innerText = randomTemp.name;
                spinCount++;

                if (spinCount > 15) {
                    clearInterval(interval);
                    const picked = filteredList[Math.floor(Math.random() * filteredList.length)];
                    displayResult(picked);

                    rouletteOverlay.style.display = 'none';
                    recommendBtn.disabled = false;

                    // 폭죽 연출
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }
            }, 80);
        }

        // 결과 화면 표시
        function displayResult(menu) {
            currentMenu = menu;

            document.getElementById('placeholderBox').style.display = 'none';
            document.getElementById('resultBox').style.display = 'flex';

            document.getElementById('resCategory').innerText = menu.category;
            document.getElementById('resName').innerText = menu.name;
            document.getElementById('resDesc').innerText = menu.desc;
            document.getElementById('resTip').innerText = menu.tip;

            const imgElement = document.getElementById('resImage');
            imgElement.src = menu.image;
            imgElement.alt = menu.name;

            // 태그 생성
            const tagsContainer = document.getElementById('resTags');
            tagsContainer.innerHTML = '';
            menu.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.innerText = tag;
                tagsContainer.appendChild(span);
            });

            document.getElementById('actionGroup').style.display = 'grid';
            document.getElementById('recommendBtn').innerHTML = `<i class="fa-solid fa-rotate-right"></i> 다른 메뉴 추천받기`;

            addHistory(menu.name);
        }

        // 히스토리 관리
        function addHistory(name) {
            if (!history.includes(name)) {
                history.unshift(name);
                if (history.length > 5) history.pop();
            }
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const section = document.getElementById('historySection');

            if (history.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';

            history.forEach(item => {
                const tag = document.createElement('span');
                tag.className = 'history-item';
                tag.innerText = item;
                tag.onclick = () => {
                    const found = menuList.find(m => m.name === item);
                    if (found) displayResult(found);
                };
                container.appendChild(tag);
            });
        }

        function clearHistory() {
            history = [];
            renderHistory();
            showToast("히스토리가 삭제되었습니다.");
        }

        // 메뉴 확정
        function confirmMenu() {
            if (!currentMenu) return;
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });
            showToast(`오늘 저녁은 [${currentMenu.name}] (으)로 결정! 🎉`);
        }

        // 결과 공유 (클립보드 복사)
        function copyShareLink() {
            if (!currentMenu) return;
            const textToCopy = `오늘 저녁 추천 메뉴: [${currentMenu.name}] - ${currentMenu.desc}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast("메뉴 추천 정보가 클립보드에 복사되었습니다!");
                }).catch(() => {
                    showToast("복사에 실패했습니다.");
                });
            } else {
                showToast("추천 메뉴: " + currentMenu.name);
            }
        }

        // 토스트 팝업 함수
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.innerText = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
